<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Transform Demo</title>

<style>
:root{
    --box:90px;
    --he:900px;
    --wi:900px;
    --b1:red;
    --b2:green;
    --b3:yellow;
}

.container{
    border:2px solid black;
    height:var(--he);
    width:var(--wi);
    padding:20px;
}

.b{
    height:var(--box);
    width:var(--box);
    margin:20px;
    transition:0.5s;
}

.item1{
    background:red;
}

.item1:hover{
    transform:translateX(100px);
}

.item2{
    background:blue;
}

.item2:hover{
    transform:scale(1.3);
}

.item3{
    background:orange;
}

.item3:hover{
    transform:rotate(45deg);
}

.item4{
    background:purple;
    color:white;
}

.item4:hover{
    transform:skew(15deg);
}
</style>
</head>

<body>

<div class="container">
    <div class="b item1"></div>

    <div class="b item2"></div>

    <div class="b item3"></div>

    <div class="b item4"></div>
</div>

</body>
</html>
