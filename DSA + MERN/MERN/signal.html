<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traffic Light</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:white;
    }

    .box{
      width:200px;
      height:400px;
      background:black;
      border-radius:20px;
      display:flex;
      flex-direction:column;
      justify-content:space-evenly;
      align-items:center;
    }

    .circle{
      width:90px;
      height:90px;
      border-radius:50%;
    }

    .red{
      background:red;
    }

    .yellow{
      background:yellow;
    }

    .green{
      background:green;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="circle red"></div>
    <div class="circle yellow"></div>
    <div class="circle green"></div>
  </div>

</body>
</html>
