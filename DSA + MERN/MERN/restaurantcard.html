<!DOCTYPE html>
<html>
<head>
<title>STAR RESTAURANT</title>

<style>

:root{
    --bg: #eee;
    --white: white;
    --purple: purple;
    --orange: orange;
    --green: green;
}

body{
    background: var(--bg);

}

.restaurant{
    width: 450px;
    background: var(--white);
    margin: 20px auto;
    padding: 15px;
}

.box{
    border: 1px solid black;
    margin: 15px 0;
}

.title{
    padding: 8px;
    font-weight: bold;
}

.drink{
    background: var(--purple);
    color: white;
}

.pizza{
    background: var(--orange);
}

.burger{
    background: var(--green);
    color: white;
}

</style>
</head>

<body>

<div class="restaurant">

    <h2>STAR RESTAURANT MENU</h2>

    <div class="box">
        <div class="title drink">Soft Drink</div>
        <div class="info">
            Fresh and chilled soft drink. Perfect for hot summer days. Price: $5.
        </div>
    </div>

    <div class="box">
        <div class="title pizza">Pizza</div>
        <div class="info">
            Delicious cheese pizza with fresh vegetables and extra cheese. Price: $19.
        </div>
    </div>

    <div class="box">
        <div class="title burger">Burger</div>
        <div class="info">
            Crispy veg burger served with lettuce, tomato, and special sauce. Price: $10.
        </div>
    </div>

</div>

</body>
</html>
