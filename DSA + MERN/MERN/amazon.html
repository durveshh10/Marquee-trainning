<!DOCTYPE html>
<html lang="en">
<head>
    <title>Amazon Layout</title>
</head>

<body>

    <!-- Main Container -->
    <div style="width:100vw; height:100vh; border:4px solid crimson; background-color:wheat;">

        <!-- Header Section -->
        <div style="height:10%; border:2px solid black; background-color:#f5c6c6;">

            <div style="display:flex; justify-content:space-around; align-items:center; padding-top:10px;">

                <b>Amazon</b>

                <span>Vadodara</span>

                <input type="text" placeholder="Search">

                <span>Account</span>

                <span>cart</span>

            </div>

        </div>

        <!-- Menu Bar -->
        <div style="height:6%; border:2px solid black; background-color:#f5c6c6; margin-top:10px;">

            <div style="display:flex; justify-content:space-around; padding-top:10px;">

                <span>Amazon Pay</span>

                <span>Mens wear</span>

                <span>Best seller</span>

                <span>Kitchen</span>

                <span>Electronics</span>

            </div>

        </div>

        <!-- Content Area -->
        <div style="height:70%; background-color:#e6c26a;">

        </div>

        <!-- Footer -->
        <div style="height:8%; background-color:#f5c6c6;">

        </div>

    </div>

</body>
</html>
