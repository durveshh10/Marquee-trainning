<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Layout</title>

<style>
.container{
    width:700px;
    height:400px;
    border:2px solid black;
    padding:10px;

    display:grid;
    gap:10px;

    grid-template-columns:2fr 1fr 1fr;
    grid-template-rows:2fr 1fr 1fr;
}

.box{
    border:2px solid black;
}

.box1{
    grid-column:1/3;
}

.box2{
    grid-column:3/4;
    grid-row:1/2;
}

.box3{
    grid-column:1/2;
    grid-row:2/3;
}

.box4{
    grid-column:2/3;
    grid-row:2/3;
}

.box5{
    grid-column:3/4;
    grid-row:2/3;
}

.box6{
    grid-column:1/3;
    grid-row:3/4;
}

.box7{
    grid-column:3/4;
    grid-row:3/4;
}
</style>

</head>
<body>

<div class="container">
    <div class="box box1"></div>
    <div class="box box2"></div>

    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>

    <div class="box box6"></div>
    <div class="box box7"></div>
</div>

</body>
</html>
