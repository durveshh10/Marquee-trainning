<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
</head>
<body>
    <!--header-->
    <h1>Job Application</h1>
    
     <main>

        <form></form>
        <!--Personal Information-->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe">
                <br>
                <br>

                <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="john.doe@example.com">
                <br>
                <br>

                <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="9876543210">
                <br>
                <br>

                <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob">
        </fieldset>
        
        <!--Gender Information-->
        <fieldset>
            <legend>Gender Information</legend>

            <input type="radio" id="male" name="gender" value="male">
                <label for="male ">Male</label>    
            <br>        
            <input type="radio" id="female " name="gender" value=" female"> 
                <label for="female">Female</label>  
            <br>
            <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </fieldset>

            <!--Skills-->
            <fieldset>

                <legend>Skills</legend>
                <label>Select Your Skills:</label>
                <input type="checkbox" id="html">
                <label for="html">HTML</label>
                <br>

                <input type="checkbox" id="css">
                <label for="css">CSS</label>
                <br>

                <input type="checkbox" id="javascript">
                <label for="javascript">JavaScript</label>
                <br>

                <input type="checkbox" id="python">
                <label for="python">Python</label>
                <br>
                
            </fieldset>

            <!--Additional Information-->
            <fieldset>
                <legend>Additional Information</legend>
                <label for="experience">Years of Experience:</label>
                <select id="experience">
                    <option disabled selected>-- Select --</option>
                    <option> 1 Year</option>
                    <br><br>
                    <option> 2 Year</option>
                    <br><br>    
                    <option> 3+ Year</option>
                    <br><br>    
                    <option value="5+">5+ years</option>
                </select> 
            <br>
            <br>

                <label for="location">Preferred Location:</label>
                <select id="location">
                    <option disabled selected>-- Select --</option>
                    <option value="in">Indore</option>
                    <option value="mp">Hyderabad</option>
                    <option value="other">Vadodra</option>
                    <option value="other">Mumbai</option>
                </select>
                <br>
                <br>
                <label for="resume">Upload Resume:</label>
                <input type="file" maxlength="10MB" accept=".pdf,.html">
            </fieldset>
            <br>    
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>


    </form>   
    </main
    
</body
</html>
