<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        ul{
            list-style: none;
            display:flex;
            justify-content:space-evenly;
            background-color:rgb(225, 138, 192);
            padding:15px;
        }

        li a{
            text-decoration:rgb(68, 150, 40);
            color:rgb(30, 25, 25);
            font-size:20px;
        }

        .hero{
            height:650px;
            background-color:#141010;
            color:rgb(64, 165, 248);

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
        }

        .hero h1{
            font-size:45px;
        }

        .hero p{
            font-size:18px;
            margin-top:10px;
        }

        .bottom{
            height: 35px;
            background-color:rgb(29, 173, 198);
        }

        .chat-box{
            width:50px;
            height:50px;
            background-color:rgb(194, 45, 80);

            position:fixed;
            right:10px;
            top:78%;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:25px;
            border-radius:10px;
        }
    </style>
</head>

<body>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Product</a></li>
        <li><a href="#">Service</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

    <div class="hero">
        <h1>Hello, World!</h1>
        <p>Welcome to our website!</p>
    </div>

    <div class="bottom"></div>
    <br>
    <div class="chat-box">
    <justify-content right; 
        align-items: center; 
        font-size: 25px; 
        border-radius: 10px;>  
    </justify-content>
        💬
    </div>

</body>
</html>
