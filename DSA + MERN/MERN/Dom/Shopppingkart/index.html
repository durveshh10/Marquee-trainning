<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛒 My Cart App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrapper">
    <h1>🛒 My Cart App</h1>

    <div class="input-box">
      <input type="text" id="pname" placeholder="Enter Item Name">
      <input type="number" id="pprice" placeholder="Enter Price">
      <input type="number" id="pqty" placeholder="Enter Quantity">

      <select id="pcategory">
        <option value="">Choose Category</option>
        <option>Electronics</option>
        <option>Clothing</option>
        <option>Food</option>
        <option>Books</option>
      </select>

      <button onclick="addItem()" id="addBtn">Add Item</button>
    </div>

    <div class="controls">
      <input type="text" id="searchBox" placeholder="Search..." onkeyup="searchItem()">
      <select id="filterBox" onchange="filterItem()">
        <option value="All">All</option>
        <option>Electronics</option>
        <option>Clothing</option>
        <option>Food</option>
        <option>Books</option>
      </select>
      <select onchange="sortCart(this.value)">
        <option value="">Sort By</option>
        <option value="price">Price</option>
        <option value="quantity">Quantity</option>
      </select>
      <button onclick="resetCart()">Reset Cart</button>
    </div>

    <div class="summary">
      <h2>Cart Overview</h2>
      <p>Items: <span id="countItems">0</span></p>
      <p>Total Qty: <span id="countQty">0</span></p>
      <p>Total Cost: ₹<span id="totalCost">0</span></p>
    </div>

    <div class="list" id="list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
