<!doctype html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style.css" />

<body>
    <div class="pointer" aria-hidden="true"></div>

    <aside class="fixed-menu" aria-hidden="true">
        <div class="fixed-menu__inner">

            <a href="#hero">HOME</a>
            <a href="#work">WORK</a>

            <div class="mode">
