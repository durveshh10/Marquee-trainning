<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhiteBoard</title>
  <style>
    body{
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #1e1e1e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .controls{
      margin-bottom: 15px;
      text-align: center;
    }

    button{
      padding: 10px 20px;
      font-size: 16px;
      background-color: coral;
      color: whitesmoke;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover{
      background-color: #c2613e;
    }


    canvas{
      border: 3px solid #ffffff;
      background-color: #44ba68;
      border-radius: 8px;
      cursor: crosshair;
      transition: background-color 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="clearBtn">Clear Board</button>
    <p>Double click for board bg-color change || right click brush color change</p>
  </div>

  <canvas id="paintCanvas" width="800" height="500"></canvas>

  <script src="script.js"></script>
</body>
</html>
