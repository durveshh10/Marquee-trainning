<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Position Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.parent{
    position:relative;
}

.box{
    width:200px;
    height:200px;
    border:2px solid black;
    display:inline-block;
    font-size:25px;
    background-color:  var(--box-color);
}

.static{
    background:red;
}

.relative{
    background:green;
}

.absolute{
    background:blue;
}

.fixed{
    background:yellow;
}

/* Box 5 */
.sticky{
    background:peachpuff;
    position:relative;
    top:100px;
    right:200px;
    z-index:1;
}
</style>
</head>

<body>

<div class="parent">
    <div class="box static">Box 1</div>
    <div class="box relative">Box 2</div>
    <div class="box absolute">Box 3</div>
    <div class="box fixed">Box 4</div>
    <div class="box sticky">Box 5</div>
</div>


</body>
</html>
