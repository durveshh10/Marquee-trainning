<!DOCTYPE html>
<html>
<head>
  <title>Profile Card</title>

  <style>

    body{
      background-color: lightgray;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
    }

    .box{
      width: 250px;
      background-color: white;
      text-align: center;
      padding: 20px;
      border-radius: 10px;
    }

    img{
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
    }

    button{
      background-color: blue;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 5px;
    }

  </style>

</head>
<body>

  <div class="box">

    <h2>Profile</h2>

    <img 
      src="https://img.freepik.com/premium-photo/black-persian-cat-is-gentle-affectionate-elegant-with-silky-black-coat-regular-grooming_956982-3108.jpg"
      alt="cat profile"
    >

    <h3>ABC</h3>

    <p>MERN Developer</p>

    <button>Follow</button>

  </div>

</body>
</html>
