<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inline Example</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      padding:20px;
    }

    .container{
      display:flex;
    }

    .box{
      width:250px;
      height:180px;
      padding:20px;
      font-size:25px;
    }

    .box1{
      background:#eef8e9;
    }

    .box2{
      background:#e7f5dc;
    }

    .box3{
      background:#dff8ff;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="box box1">
      <p>Hello</p>
      <p>How Are You</p>
    </div>

    <div class="box box2">
      <p>Welcome</p>
    </div>


    </div>

  </div>

</body>
</html>
