<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="flipkart.css">
</head>

<body>

    <!-- HEADER SECTION -->
    <header class="header">

        <div class="top">
            <div class="logo">Flipkart</div>
            <div class="travel">Travel</div>
            <div class="location">Vadodara, Gujarat</div>
        </div>

        <div class="middle">
            <input type="text" placeholder="Search for products, brands and more" class="search">

            <span>Login</span>
            <span>More</span>
            <span>Cart</span>
        </div>

        <div class="medium"></div>

        <div class="bottom">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

    </header>

    <!-- HERO SECTION -->

    <section id="hero">

        <div class="hero">

            <div class="image">

                <img src="https://rukminim2.flixcart.com/fk-p-flap/3140/1540/image/52dff66d7ee2e898.jpg?q=60"
                    alt="Image 1">

                <img src="https://rukminim2.flixcart.com/fk-p-flap/3140/1540/image/bcfccba1b21c41c1.png?q=60"
                    alt="Image 2">

                <img src="https://rukminim1.flixcart.com/fk-p-flap/3140/1040/image/201969c9fae1915c.jpg?q=60"
                    alt="Image 3">

            </div>

        </div>

    </section>

    <!-- RECOMMENDATION SECTION -->

    <section id="recommendation">

    </section>

    <!-- FOOTER SECTION -->

    <footer class="description">

        <div>
            <h2>Flipkart</h2>

            <p>
                Flipkart is an Indian e-commerce company headquartered in Bengaluru, Karnataka, India.
                It was founded in 2007 by Sachin Bansal and Binny Bansal.
            </p>
        </div>

        <div class="about">
            <p>About Us</p>
            <p>Contact</p>
            <p>Contact Us</p>
            <p>Desk Number</p>
        </div>

        <div class="help">
            <p>Helpline Number</p>
            <p>Service Centre</p>
        </div>

        <div class="offer">

        </div>

    </footer>

</body>

</html>
